<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Science Center Events</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="glass-header">
        <div class="logo">スポーツ科学総合センター<span>Events</span></div>
        <nav>
            <a href="#" id="nav-home" class="active">ホーム</a>
            <a href="#" id="nav-calendar">カレンダー</a>
            <a href="#" id="nav-report-form">実施報告</a>
        </nav>
    </header>

    <main>
        <!-- Home View (Card Grid) -->
        <div id="view-home" class="view-section">
            <section class="hero">
                <h1>社内イベント管理</h1>
                <p>イベント・研修の一覧です。</p>
                <div class="hero-actions">
                    <button class="primary-btn"
                        onclick="document.getElementById('nav-calendar').click()">スケジュールを確認</button>
                    <a class="secondary-btn"
                        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=eACP1I6cuUisbBhcL4VwOpdznCy2Zp9FjpyHcw3ZV5dUNU5CUlNHV0Y4UEJFTFNJM0o5NDhOMTM3TS4u"
                        target="_blank">イベントを申請する</a>
                </div>
            </section>

            <section class="event-list" id="event-grid">
                <!-- Cards will be populated dynamically via JS -->
            </section>
        </div>

        <!-- Calendar View -->
        <div id="view-calendar" class="view-section" style="display: none;">
            <section class="gantt-header">
                <h2 id="calendar-title">月間スケジュール</h2>
                <p id="calendar-desc">現在予定されている社内イベントのスケジュール進行です。</p>
            </section>

            <div class="gantt-controls">
                <!-- Gantt navigation -->
                <div class="gantt-nav" id="gantt-nav">
                    <button id="gantt-prev" class="icon-btn">&lt; 前へ</button>
                    <span id="gantt-current-date-label">2026年 11月</span>
                    <button id="gantt-next" class="icon-btn">次へ &gt;</button>
                </div>
                <!-- Month calendar navigation (hidden by default) -->
                <div class="gantt-nav" id="month-cal-nav" style="display:none;">
                    <button id="month-cal-prev" class="icon-btn">&lt; 前月</button>
                    <span id="month-cal-label" style="min-width:150px; text-align:center;"></span>
                    <button id="month-cal-next" class="icon-btn">次月 &gt;</button>
                </div>
                <!-- Day navigation (hidden by default) -->
                <div class="gantt-nav" id="day-nav" style="display:none;">
                    <button id="day-prev" class="icon-btn">&lt; 前日</button>
                    <span id="day-date-label" style="min-width:180px; text-align:center;"></span>
                    <button id="day-next" class="icon-btn">次日 &gt;</button>
                    <button id="day-today" class="icon-btn"
                        style="border-left:1px solid rgba(255,255,255,0.15); padding-left:1rem; margin-left:0.5rem;">今日</button>
                    <button id="day-mode-toggle-btn" class="icon-btn day-mode-btn" title="表示切替">⇄ 横</button>
                </div>
                <div class="gantt-view-options">
                    <button class="view-btn" data-days="1">1日</button>
                    <button class="view-btn" data-days="7">1週間</button>
                    <button class="view-btn" data-days="14">2週間</button>
                    <button class="view-btn active" data-days="30">1ヶ月</button>
                    <button class="view-btn view-btn-cal" data-mode="month-cal">📅 カレンダー</button>
                </div>
            </div>

            <!-- Gantt chart -->
            <section class="gantt-view-container" id="gantt-view-container">
                <div class="gantt-timeline-header" id="gantt-header-days"></div>
                <div id="gantt-tracks"></div>
            </section>

            <!-- Monthly calendar grid view -->
            <div id="month-cal-container" style="display:none;"></div>

            <!-- 1日 timeline view -->
            <div id="day-view-container" style="display:none;">
                <!-- All-day events -->
                <div class="day-allday-section">
                    <div class="day-allday-label">終日</div>
                    <div class="day-allday-events" id="day-allday-events"></div>
                </div>
                <!-- 24h timeline (PC Grid) -->
                <div class="day-timeline-container hide-on-mobile" id="day-timeline-container">
                    <!-- Populated by JS -->
                </div>
                <!-- 24h timeline (Mobile List/Agenda) -->
                <div class="day-agenda-container hide-on-desktop" id="day-agenda-container">
                    <!-- Populated by JS -->
                </div>
                <!-- Horizontal resource timeline view -->
                <div id="day-horizontal-container" style="display:none;"></div>
            </div>
        </div>
        <!-- Report Form View -->
        <div id="view-report-form" class="view-section" style="display: none;">
            <section class="report-form-section">
                <h2>実施報告フォーム</h2>
                <p class="report-form-desc">イベント実施後に実績情報を報告してください。送信された報告は管理者の承認後に反映されます。</p>

                <!-- Firebase設定（折りたたみ） -->
                <div class="rf-firebase-panel" id="rf-firebase-panel">
                    <div class="rf-firebase-header" onclick="toggleReportFirebaseSettings()">
                        <span>Firebase 接続設定</span>
                        <span id="rf-firebase-badge" class="rf-badge rf-badge-disconnected">未接続</span>
                        <span id="rf-firebase-toggle">▼</span>
                    </div>
                    <div id="rf-firebase-body" style="display:none;">
                        <p class="rf-firebase-desc">実施報告の送信にはFirebase接続が必要です。管理者から提供された設定を貼り付けてください。</p>
                        <div class="report-form-group">
                            <label>Firebase設定（firebaseConfig をそのまま貼り付け）</label>
                            <textarea id="rf-firebase-config" rows="7" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;AIzaSy...&quot;,&#10;  databaseURL: &quot;https://...&quot;,&#10;  ...&#10;};"></textarea>
                        </div>
                        <button class="primary-btn" onclick="connectReportFirebase()">接続する</button>
                    </div>
                </div>

                <!-- 報告フォーム本体 -->
                <div id="rf-form-body" class="rf-form-body">

                    <div class="report-form-group">
                        <label>登録済みイベントから選択（任意）</label>
                        <select id="rf-event-select" onchange="onReportEventSelect()">
                            <option value="">-- 選択すると下の項目が自動入力されます --</option>
                        </select>
                    </div>

                    <div class="report-form-group">
                        <label>イベント名 <span class="rf-required">※必須</span></label>
                        <input type="text" id="rf-event-title" placeholder="例: インフィールド・クリニック2026春">
                    </div>

                    <div class="report-form-group">
                        <label>日程 <span class="rf-required">※必須</span></label>
                        <input type="text" id="rf-event-date-text" placeholder="例: 2026年3月30日（月）、31日（火）">
                    </div>

                    <div class="report-form-group">
                        <label>主催 <span class="rf-required">※必須</span></label>
                        <input type="text" id="rf-organizer" placeholder="例: Ulunoa base 武拓人 × SKILLED.C 緑川大陸">
                    </div>

                    <div class="report-form-group">
                        <label>協力（任意）</label>
                        <input type="text" id="rf-supporter" placeholder="例: エイジェックスポーツ科学総合センター">
                    </div>

                    <div class="report-form-group">
                        <label>対象（任意）</label>
                        <input type="text" id="rf-target" placeholder="例: 小学5・6年生、中学生">
                    </div>

                    <div class="report-form-group">
                        <label>内容（任意）<span class="rf-field-hint">各行が箇条書きになります</span></label>
                        <div id="rf-contents-list"></div>
                        <button type="button" class="secondary-btn rf-add-row-btn" onclick="addContentRow()">＋ 内容を追加</button>
                    </div>

                    <div class="report-form-group">
                        <label>本文（任意）<span class="rf-field-hint">段落ごとに追加してください</span></label>
                        <div id="rf-paragraphs-list"></div>
                        <button type="button" class="secondary-btn rf-add-row-btn" onclick="addParagraphRow()">＋ 段落を追加</button>
                    </div>

                    <div class="report-form-group">
                        <label>写真URL（OneDriveの共有リンクなど）</label>
                        <div id="rf-photos-list"></div>
                        <button type="button" class="secondary-btn rf-add-row-btn" onclick="addReportPhotoRow()">＋ 写真を追加</button>
                    </div>

                    <div class="report-form-group">
                        <label>報告者名 <span class="rf-required">※必須</span></label>
                        <input type="text" id="rf-reporter-name" placeholder="例: 山田 太郎">
                    </div>

                    <div class="report-form-actions">
                        <button class="primary-btn" onclick="submitReport()">送信する</button>
                    </div>

                    <div id="rf-submit-message" class="rf-submit-message" style="display:none;"></div>
                </div>
            </section>
        </div>

    </main>

    <!-- ========== 詳細モーダル ========== -->
    <div id="detail-overlay" class="detail-overlay" style="display:none;">
        <div class="detail-modal">
            <button class="detail-close" onclick="closeDetail()">✕</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
